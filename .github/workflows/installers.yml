# Tests, and gout's installers for Linux, macOS and Windows. Every push builds and tries them;
# a tag vX.Y.Z (matching gout/core.py) publishes them as a GitHub release.
name: installers

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tests:
    name: tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: the whole suite
        run: python3 tests/run.py

  linux:
    name: installer (Linux .deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 packaging/build.py deb
      - name: install it with apt, as a person would
        run: sudo apt-get update -qq && sudo apt-get install -y ./dist/gout_*_all.deb
      - name: try the installed gout
        run: python3 packaging/smoke.py gout
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb

  macos:
    name: installer (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - name: the program, with Python and ffmpeg inside
        run: python packaging/build.py app
      - name: the whole suite, run on the built program and its ffmpeg
        working-directory: tests
        run: |
          export PATH="$GITHUB_WORKSPACE/dist/app/gout/ffmpeg:$PATH"
          export GOUT_TEST_COMMAND="$GITHUB_WORKSPACE/dist/app/gout/gout"
          python run.py
      - name: the installer
        run: python packaging/build.py pkg
      - name: install it, as a person would
        run: sudo installer -pkg dist/gout-*.pkg -target /
      - name: try the installed gout
        run: python packaging/smoke.py /usr/local/bin/gout
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.pkg

  windows:
    name: installer (Windows)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller windows-curses
      - name: the program, with Python, curses and ffmpeg inside
        run: python packaging/build.py app
      - name: the tests that need no Unix terminal, run on the built program and its ffmpeg
        working-directory: tests
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\dist\app\gout\ffmpeg;$env:PATH"
          $env:GOUT_TEST_COMMAND = "$env:GITHUB_WORKSPACE\dist\app\gout\gout.exe"
          python run.py test_project test_chain test_mix test_fx test_cut test_timeline test_addons test_play test_live test_formula
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: the installer
        run: python packaging/build.py setup
      - name: install it, as a person would (silently here), and try it
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\gout-*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          python packaging/smoke.py "$env:LOCALAPPDATA\Programs\gout\gout.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "gout ${GITHUB_REF_NAME#v}" --notes-file packaging/RELEASE.md
