[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gout"
version = "2.0.0"
description = "A command-line DAW: stack wav/mp3 tracks on a timeline, mix to master.wav; also cuts mp3s by time or size."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
gout = "gout.cli:main"

[tool.setuptools]
packages = ["gout", "gout.effects"]

[tool.setuptools.package-data]
gout = ["webpage/*"]
