[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gout"
version = "1.0.0"
description = "Cut a piece out of an .mp3 by time or by target file size."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
gout = "gout:main"

[tool.setuptools]
py-modules = ["gout"]
